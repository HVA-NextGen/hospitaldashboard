name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HospitalDashboard.slnx
      - name: Build
        run: dotnet build HospitalDashboard.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HospitalDashboard.slnx -c Release --no-build --logger trx
      - name: Publish host
        run: dotnet publish src/HospitalDashboard.Host/HospitalDashboard.Host.csproj -c Release --no-build -o artifacts/publish
      - name: Build container
        run: docker build --tag hospitaldashboard:ci .
